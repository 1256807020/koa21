<div id="header-wrapper">
    <div class="header-inner">
        <div class="logo">
            <img src="{{__HOST__}}/{{site.logo}}" alt="{{site.title}}">
        </div>
        <div class="nav">
            <ul class="clear">
                {{each nav}}
                <li>
                    <a href="{{$value.url}}" {{if pathname==$value.url}} class="active" {{/if}}>{{$value.title}}</a>
                </li>
                {{/each}}
            </ul>
        </div>
    </div>
</div>
